version: '3.8'

services:
  # OpenTelemetry Collector (Receives OTLP HTTP :4318 & gRPC :4317)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: prism-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8888:8888" # OTel Collector internal metrics
    restart: unless-stopped

  # Grafana Tempo (Distributed Tracing Backend)
  tempo:
    image: grafana/tempo:2.4.0
    container_name: prism-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Tempo HTTP
      - "4317"
    restart: unless-stopped

  # Prometheus (Metrics Scraper & Time-Series DB)
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prism-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Grafana Loki (Log Aggregation)
  loki:
    image: grafana/loki:2.9.4
    container_name: prism-loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  # Grafana Dashboard UI
  grafana:
    image: grafana/grafana:10.3.3
    container_name: prism-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    restart: unless-stopped

